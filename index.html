<!DOCTYPE html>

<style>
/* Layout: glass sticky header, content views that rise in on tab change, floating pill tab bar, spring bottom sheets. Deep green ground, caramel-brown accent, cream text. */
:root{--bg:#07201b;--surf:#0f2f28;--surf2:#17433a;--line:#25574b;--tx:#f5f0e6;--mute:#9ab5aa;--br:#d29a64;--brd:#8c5c34;--ink:#1c1208;--ok:#7bd49c;--warn:#f0c85a;--bad:#f58573;--glass:#08241dcc;--fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Manrope',system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);--grad:linear-gradient(135deg,#e0a971,#b5773f);color-scheme:dark}

body{background:radial-gradient(900px 420px at 100% -5%,#1d5c4a66,transparent 65%),radial-gradient(700px 380px at -10% 38%,#8c5c3428,transparent 65%),var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.45 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px;font-variant-numeric:tabular-nums}

button:active{transform:scale(.96)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid #25574b99}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:14px 14px 14px 5px;background:var(--grad);color:var(--ink);display:grid;place-items:center;font:700 19px var(--fd);letter-spacing:.5px;flex:none;box-shadow:0 6px 18px #b5773f55}
.brand b{font:700 25px/1 var(--fd);text-transform:uppercase;letter-spacing:.8px;display:block}
.brand small{color:var(--mute);font-size:11px;letter-spacing:.3px}

.strip{display:flex;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#ffffff08;border-radius:99px;padding:8px 16px;font-weight:700;font-size:13px;color:var(--mute)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);box-shadow:0 6px 16px #0006}
.inp{width:100%;background:#ffffff0d;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;transition:border-color .2s,box-shadow .2s,background .2s}

.cat{font:700 21px var(--fd);letter-spacing:1.4px;text-transform:uppercase;color:var(--br);margin:8px 0 10px;display:flex;align-items:center;gap:12px}.cat::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.it::after{content:"+";position:absolute;right:10px;bottom:10px;width:28px;height:28px;border-radius:50%;background:var(--grad);color:var(--ink);display:grid;place-items:center;font:800 18px/1 var(--fb);box-shadow:0 4px 10px #0005}

.badge{position:absolute;top:-8px;right:-6px;min-width:28px;height:28px;border-radius:99px;background:var(--tx);color:var(--bg);font-weight:800;display:grid;place-items:center;padding:0 7px;z-index:1;box-shadow:0 4px 12px #0007;border:2px solid var(--bg)}
.it.tap .badge{animation:pop .4s var(--ease)}
.bar{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}

.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;box-shadow:0 14px 34px #0009}
.tab{background:none;border:0;border-radius:18px;padding:8px 0 7px;color:var(--mute);font:700 10.5px var(--fb);letter-spacing:.5px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px}

.tab.on{color:var(--tx);background:var(--surf2);box-shadow:inset 0 0 0 1px var(--line)}.tab.on svg{stroke:var(--br);transform:translateY(-1px) scale(1.12)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:15px;background:var(--surf2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.btn.pri{background:var(--grad);color:var(--ink);box-shadow:0 8px 20px #b5773f55,inset 0 1px 0 #ffffff55}.btn.dng{background:transparent;box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.sp{justify-content:space-between}
.mut{color:var(--mute)}
.ov{position:fixed;inset:0;z-index:50;background:#020d0acc;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center}
.ov:not([hidden]){animation:fade .25s ease-out}
.sheet{background:linear-gradient(180deg,#143a32,#0f2f28 40%);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:13px;position:relative;box-shadow:0 -20px 50px #0008}
.sheet.enter{animation:up .45s var(--ease)}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:42px;height:4px;margin-left:-21px;border-radius:9px;background:var(--line)}
.sheet h2{margin:0;font:700 28px var(--fd);letter-spacing:1px;text-transform:uppercase}
.x{background:var(--surf2);border:1px solid var(--line);border-radius:99px;width:36px;height:36px;font-size:16px;flex:none}
.line{border-bottom:1px dashed var(--line);padding-bottom:11px;display:flex;flex-direction:column;gap:8px}
.lh{display:flex;justify-content:space-between;gap:8px}.lh span{color:var(--mute)}
.note{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:5px 0;font-size:12px;color:var(--mute);outline:0;transition:border-color .2s}.note:focus{border-color:var(--br);color:var(--tx)}
.lq{display:flex;justify-content:space-between;align-items:center}
.step{display:flex;align-items:center;gap:13px}.step button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-size:19px;font-weight:800}.step b{min-width:20px;text-align:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#00000040;border-radius:13px;padding:3px;gap:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--grad);color:var(--ink);box-shadow:0 4px 12px #b5773f55}
.sum{display:flex;flex-direction:column;gap:6px}.sum div{display:flex;justify-content:space-between}
.tot{font:700 32px var(--fd);letter-spacing:.5px;color:var(--br)}
.meth{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.meth button{border:1.5px solid var(--line);background:#00000030;border-radius:16px;padding:14px 4px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px}.meth small{font-weight:600;color:var(--mute);font-size:10px}
.meth button.on{border-color:var(--br);background:linear-gradient(160deg,#2a4a3d,#17433a);box-shadow:0 0 0 3px #d29a6430}
.qk{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:#00000030;border-left:3px solid var(--br);padding:10px 12px;border-radius:5px 12px 12px 5px;font-size:12px;color:var(--mute)}
.rc{background:#f7f2e8;color:#1f1a12;border-radius:8px;padding:18px 16px 20px;font-family:'Courier New',monospace;font-size:12.5px;display:flex;flex-direction:column;gap:3px;box-shadow:0 10px 30px #0006;animation:unfold .7s var(--ease)}
.rc .c{text-align:center}.rc .c b{font:700 23px var(--fd);letter-spacing:1px;text-transform:uppercase}
.rc .l{display:flex;justify-content:space-between;gap:10px}.rc hr{border:0;border-top:1px dashed #1f1a12;width:100%;margin:5px 0}
.rc small{color:#6b5f4d;padding-left:14px}.rc .v{background:#b3261e;color:#fff;text-align:center;padding:4px;font-weight:700;margin-bottom:4px;border-radius:3px}
.hl{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(160deg,#17433a99,#0f2f28);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.hl:active{background:var(--surf2)}.hl.v{opacity:.55}.hl.v .t{text-decoration:line-through}
.pill{font-size:10px;font-weight:800;border-radius:99px;padding:3px 9px;background:var(--surf2);color:var(--tx);text-transform:uppercase;letter-spacing:.5px;box-shadow:inset 0 0 0 1px var(--line)}
.pill.void{background:var(--bad);color:var(--ink);box-shadow:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #0004}
.stat>div{background:var(--surf);padding:14px}.stat>div:first-child{grid-column:1/-1;background:linear-gradient(135deg,#a86d3b,#6e4425 70%);padding:18px 16px}
.stat small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.7px}.stat>div:first-child small{color:#f3d9bd}
.stat b{font:700 30px/1.1 var(--fd);letter-spacing:.4px}.stat>div:first-child b{font-size:42px}
.sec{display:flex;flex-direction:column;gap:9px;background:#ffffff06;border:1px solid #25574b88;border-radius:18px;padding:14px}.sec h3{margin:0 0 2px;font:700 20px var(--fd);letter-spacing:1.2px;text-transform:uppercase;color:var(--br)}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--mute);text-align:right;padding:4px 0}.tb th:first-child,.tb td:first-child{text-align:left}.tb td{text-align:right;padding:8px 0;border-top:1px solid #25574b88}.tb tfoot td{font-weight:800;border-top:2px solid var(--line)}
.wrap{overflow-x:auto}
.br{display:grid;grid-template-columns:50px 1fr auto;gap:9px;align-items:center;font-size:12px}.bt{display:block;height:11px;background:#00000040;border-radius:6px;overflow:hidden}.bt u{display:block;height:100%;background:var(--grad);border-radius:6px;transform-origin:left;animation:grow .8s var(--ease) both}
.mrow{display:grid;grid-template-columns:1fr 84px 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #25574b88}.mrow .inp{padding:8px 9px;text-align:right}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#toast{position:fixed;left:50%;transform:translate(-50%,16px) scale(.96);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);box-shadow:0 10px 30px #0008}

@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

body{background:radial-gradient(900px 420px at 100% -5%,#1d5c4a66,transparent 65%),radial-gradient(700px 380px at -10% 38%,#8c5c3428,transparent 65%),radial-gradient(#ffffff0d 1px,transparent 1.3px) 0 0/20px 20px,var(--bg);background-attachment:fixed}

.pt{font:700 64px/.9 var(--fd);letter-spacing:3px;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.4px var(--tx);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:4px}

.grid .it:nth-child(4n+1){border-radius:24px 24px 24px 6px}.grid .it:nth-child(4n+2){border-radius:24px 6px 24px 24px}.grid .it:nth-child(4n+3){border-radius:6px 24px 24px 24px}.grid .it:nth-child(4n){border-radius:24px 24px 6px 24px}
.tabs{display:flex;gap:3px}

.tab span{max-width:0;overflow:hidden;opacity:0;white-space:nowrap;transition:max-width .5s var(--ease),opacity .3s,margin .3s}
.tab.on{flex:2.4 1 0;background:var(--tx);color:var(--bg);box-shadow:0 6px 18px #0006}.tab.on svg{stroke:var(--bg);transform:none}.tab.on span{max-width:70px;opacity:1;margin-left:6px}
.acard{display:flex;flex-direction:column;gap:11px;background:linear-gradient(160deg,#17433acc,#0f2f28);border:1px solid var(--line);border-radius:24px 24px 24px 6px;padding:15px;box-shadow:0 8px 22px #0003}
.av{width:46px;height:46px;border-radius:50% 50% 50% 12px;background:var(--grad);color:var(--ink);display:grid;place-items:center;font:700 24px var(--fd);flex:none}
.pill.on{background:var(--ok);color:var(--ink);box-shadow:none}
.srow{display:grid;grid-template-columns:1fr 76px 76px 40px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #25574b88}.srow .inp{padding:10px 8px;text-align:right;font-size:13px}.srow b{display:block;font-size:13px;line-height:1.2}.srow small{display:block;font-size:11px;min-height:14px}.srow.xx b{opacity:.5;text-decoration:line-through}.srow .btn.sm{padding:10px 0;text-align:center}
.sk{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap}.sk th,.sk td{padding:6px 8px;text-align:right;border-bottom:1px solid #25574b88}.sk th{color:var(--mute);font-weight:700}.sk td:first-child,.sk th:first-child{position:sticky;left:0;text-align:left;background:var(--surf);z-index:1;font-weight:700}
.rlogo{width:150px;max-width:70%}

#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center}#splash img{width:min(270px,72vw);animation:splash 1.3s var(--ease) both}#splash.out{opacity:0;transition:opacity .5s;pointer-events:none}
@keyframes splash{0%{opacity:0;transform:scale(.7) rotate(-4deg)}55%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}

/* Login + user chip */

 const disc=c.dType==='pct'?Math.round(sub*Math.min(c.dVal,100)/100):Math.min(c.dVal,sub);
 const base=sub-disc,svc=Math.round(base*S.set.svc/100),tax=Math.round((base+svc)*S.set.tax/100);
 return{sub,disc,svc,tax,total:base+svc+tax}}

function mCart(){const c=C(),k=calc();
 const rows=c.items.map(l=>{const m=mById(l.id);return `<div class="line"><div class="lh"><b>${esc(m.name)}${l.temp?' · '+l.temp:''}</b><span>${rp(m.price)}</span></div>${l.temp?`<div class="seg" style="width:130px">${['Ice','Hot'].map(t=>`<button class="${l.temp===t?'on':''}" data-act="tmp" data-id="${lk(l)}" data-v="${t}">${t}</button>`).join('')}</div>`:''}
 <input class="note" data-chg="note" data-id="${lk(l)}" value="${esc(l.note)}" placeholder="Catatan (less sugar, es sedikit...)" maxlength="60">
 <div class="lq"><div class="step"><button data-act="dec" data-id="${lk(l)}">−</button><b>${l.qty}</b><button data-act="inc" data-id="${lk(l)}">+</button></div><b>${rp(m.price*l.qty)}</b></div></div>`}).join('');
 return `<div class="row sp"><h2>Pesanan</h2><button class="x" data-act="closeM">✕</button></div>

 <div class="sum"><div><span class="mut">Subtotal</span><span>${rp(k.sub)}</span></div>${k.disc?`<div><span class="mut">Diskon</span><span class="warn">− ${rp(k.disc)}</span></div>`:''}${k.svc?`<div><span class="mut">Service ${S.set.svc}%</span><span>${rp(k.svc)}</span></div>`:''}${k.tax?`<div><span class="mut">Pajak ${S.set.tax}%</span><span>${rp(k.tax)}</span></div>`:''}<div class="tot"><span>Total</span><span>${rp(k.total)}</span></div></div>
 <div class="row"><button class="btn dng" data-act="clearCart">Kosongkan</button><button class="btn pri" style="flex:1" data-act="toPay" ${k.total>0||c.items.length?'':'disabled'}>Bayar ${rp(k.total)}</button></div>`}
function quick(t){const a=[t,Math.ceil(t/5000)*5000,Math.ceil(t/10000)*10000,Math.ceil(t/50000)*50000,Math.ceil(t/100000)*100000];return [...new Set(a)].filter(x=>x>0).slice(0,5)}

 const cash=p.m==='Tunai';

function rcpt(o){const L=(a,b,x)=>`<div class="l"><span>${a}</span><span>${b}</span></div>`;
 return `<div class="rc">${o.status==='open'?'<div class="v">BELUM DIBAYAR</div>':o.status!=='ok'?`<div class="v">DIBATALKAN${o.voidReason?' · '+esc(o.voidReason):''}</div>`:''}

function rcptText(o){const l=[];l.push('NEST & NIBBLE','Coffee and Bakes','No: '+o.no,dmy(ymd(o.ts))+' '+hm(o.ts),o.otype+(o.who?' · '+o.who:''),o.by?'Kasir: '+o.by:'','--------------------');

 if(o.disc)l.push('Diskon -'+rp(o.disc));if(o.svc)l.push('Service '+rp(o.svc));if(o.tax)l.push('Pajak '+rp(o.tax));l.push('TOTAL '+rp(o.total),'Bayar: '+mLabel(o.method));
 if(o.method==='Tunai')l.push('Diterima '+rp(o.paid),'Kembali '+rp(o.change));if(o.status!=='ok')l.push('*** DIBATALKAN ***');l.push('Terima kasih!');return l.join('\n')}

function rng(){const t=today();let f=t,e=t;
 if(ui.rg==='yest')f=e=ymd(Date.now()-864e5);else if(ui.rg==='7d')f=ymd(Date.now()-6*864e5);else if(ui.rg==='mon')f=t.slice(0,8)+'01';else if(ui.rg==='cus'){f=ui.from||t;e=ui.to||t}
 if(f>e){const x=f;f=e;e=x}return[f,e]}
function stats(f,e){const all=S.orders.filter(o=>{const d=ymd(o.ts);return d>=f&&d<=e}),ok=all.filter(o=>o.status==='ok'),vd=all.filter(o=>o.status==='void');
 const sum=(a,k)=>a.reduce((s,o)=>s+o[k],0);const r={f,e,ok,vd,n:ok.length,sub:sum(ok,'sub'),disc:sum(ok,'disc'),svc:sum(ok,'svc'),tax:sum(ok,'tax'),total:sum(ok,'total')};
 r.items=ok.reduce((s,o)=>s+o.items.reduce((a,l)=>a+l.qty,0),0);r.avg=r.n?Math.round(r.total/r.n):0;r.voidAmt=sum(vd,'total');
 r.meth=['Tunai','QRIS','Debit','GoPay'].map(m=>{const a=ok.filter(o=>o.method===m);return{m,n:a.length,t:sum(a,'total')}});
 r.ot=['Dine in','Take away'].map(m=>{const a=ok.filter(o=>o.otype===m);return{m,n:a.length,t:sum(a,'total')}});
 const pr={},ct={};ok.forEach(o=>o.items.forEach(l=>{(pr[l.name]=pr[l.name]||{n:l.name,q:0,t:0}).q+=l.qty;pr[l.name].t+=l.price*l.qty;(ct[l.cat]=ct[l.cat]||{n:l.cat,q:0,t:0}).q+=l.qty;ct[l.cat].t+=l.price*l.qty}));
 r.prod=Object.values(pr).sort((a,b)=>b.q-a.q||b.t-a.t);r.cat=Object.values(ct).sort((a,b)=>b.t-a.t);
 r.exp=expRange(f,e);r.hour=[];for(let h=0;h<24;h++){const a=ok.filter(o=>new Date(o.ts).getHours()===h);if(a.length)r.hour.push([pad(h)+':00',sum(a,'total')])}
 const dd={};ok.forEach(o=>{const k=ymd(o.ts);dd[k]=(dd[k]||0)+o.total});r.day=Object.keys(dd).sort().map(k=>[k.slice(8)+'/'+k.slice(5,7),dd[k]]);return r}
function bars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="br"><span class="mut">${r[0]}</span><i class="bt"><u style="width:${Math.max(2,r[1]/mx*100)}%"></u></i><b>${rp(r[1])}</b></div>`).join('')}
function vLaporan(){const[f,e]=rng(),r=stats(f,e),single=f===e,R=[['today','Hari ini'],['yest','Kemarin'],['7d','7 hari'],['mon','Bulan ini'],['cus','Pilih']];
 let cash='';if(single){const cs=r.meth[0].t,op=S.cashOpen[f]||0,ex=expDay(f),exp=op+cs-ex,cnt=S.cashCount[f],diff=cnt==null?null:cnt-exp;
  cash=`<div class="sec"><h3>Rekonsiliasi Kas</h3><div class="mrow" style="border:0"><span>Modal kas awal</span><input class="inp" data-chg="open" data-d="${f}" inputmode="numeric" value="${op||''}" placeholder="0" style="grid-column:2/4"></div>
  <div class="sum"><div><span class="mut">Penjualan tunai</span><span>${rp(cs)}</span></div>${ex?`<div><span class="mut">Pengeluaran</span><span class="bad">− ${rp(ex)}</span></div>`:''}<div><b>Kas seharusnya di laci</b><b>${rp(exp)}</b></div></div>
  <div class="mrow" style="border:0"><span>Kas dihitung fisik</span><input class="inp" data-chg="count" data-d="${f}" inputmode="numeric" value="${cnt==null?'':cnt}" placeholder="isi saat tutup" style="grid-column:2/4"></div>
  ${diff==null?'':`<div class="row sp"><b>Selisih</b><b class="${diff===0?'ok':diff>0?'warn':'bad'}">${diff===0?'Sesuai':(diff>0?'Lebih ':'Kurang ')+rp(Math.abs(diff))}</b></div>`}</div>`}
 return `<div class="chips">${R.map(x=>`<button class="chip ${ui.rg===x[0]?'on':''}" data-act="rg" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
 ${ui.rg==='cus'?`<div class="row"><input class="inp" type="date" data-chg="from" value="${ui.from}"><span class="mut">s/d</span><input class="inp" type="date" data-chg="to" value="${ui.to}"></div>`:''}
 <div class="mut" style="font-size:12px">Periode ${single?dmy(f):dmy(f)+' – '+dmy(e)}</div>
 <div class="stat"><div><small>Total penjualan diterima</small><b>${rp(r.total)}</b></div><div><small>Transaksi</small><b>${r.n}</b></div><div><small>Item terjual</small><b>${r.items}</b></div><div><small>Rata-rata / transaksi</small><b>${rp(r.avg)}</b></div><div><small>Dibatalkan</small><b class="${r.vd.length?'bad':''}">${r.vd.length}</b></div></div>
 <div class="sec"><h3>Ringkasan</h3><div class="sum"><div><span class="mut">Penjualan kotor</span><span>${rp(r.sub)}</span></div><div><span class="mut">Diskon</span><span>− ${rp(r.disc)}</span></div><div><span class="mut">Penjualan bersih</span><span>${rp(r.sub-r.disc)}</span></div><div><span class="mut">Service</span><span>${rp(r.svc)}</span></div><div><span class="mut">Pajak</span><span>${rp(r.tax)}</span></div><div><b>Total diterima</b><b>${rp(r.total)}</b></div>${r.exp?`<div><span class="mut">Pengeluaran</span><span class="bad">− ${rp(r.exp)}</span></div><div><b>Setelah pengeluaran</b><b>${rp(r.total-r.exp)}</b></div>`:''}${r.vd.length?`<div><span class="mut">Nilai transaksi batal (tidak dihitung)</span><span class="bad">${rp(r.voidAmt)}</span></div>`:''}</div></div>
 <div class="sec"><h3>Metode Pembayaran</h3><div class="wrap"><table class="tb"><thead><tr><th>Metode</th><th>Trx</th><th>Nominal</th><th>%</th></tr></thead><tbody>${r.meth.map(m=>`<tr><td>${m.m==='Tunai'?'Tunai':m.m==='GoPay'?'QRIS GoPay':m.m+' · EDC BCA'}</td><td>${m.n}</td><td>${rp(m.t)}</td><td>${r.total?Math.round(m.t/r.total*100):0}%</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td>${r.n}</td><td>${rp(r.total)}</td><td></td></tr></tfoot></table></div>
 <div class="mut" style="font-size:12px">Cek silang: total QRIS + Debit ${rp(r.meth[1].t+r.meth[2].t)} harus sama dengan settlement EDC BCA.</div></div>

let DB=null,RO=false,applying=false,sr;const T={},TITLE={kasir:'Kasir',riwayat:'Riwayat',laporan:'Laporan',absen:'Absen',stok:'Stok',resep:'Resep',setelan:'Setelan'};
const sigNow=()=>JSON.stringify([S.menu,S.set.tax,S.set.svc,S.set.grace,S.sitems,S.resep]);let cfgSig=sigNow();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function setSync(s){const e=$('#sy');if(!e)return;e.className='sy '+s;e.querySelector('span').textContent={ok:'Live',wait:'Sinkron…',err:'Gagal sinkron',off:'Lokal'}[s]}
const cfgObj=()=>({menu:S.menu,set:{tax:S.set.tax,svc:S.set.svc,grace:S.set.grace},sitems:S.sitems,resep:S.resep,u:S.cfgU});
function cfgCheck(){const g=sigNow();if(g!==cfgSig){cfgSig=g;if(!applying&&!RO){S.cfgU=Date.now();mark('cfg/main')}}}
function mark(path){if(RO)return;S.dirty[path]=1;persist();clearTimeout(T[path]);T[path]=setTimeout(()=>flush(path),500)}
function docFor(p){const a=p.split('/'),c=a[0],id=a[1];if(c==='orders')return S.orders.find(o=>o.id===id);if(c==='att')return S.att.find(o=>o.id===id);if(c==='exp')return S.exp.find(o=>o.id===id);if(c==='stock')return S.stock[id];
 if(c==='day')return{d:id,open:S.cashOpen[id]||0,count:S.cashCount[id]==null?null:S.cashCount[id],u:S.dayU[id]||0};if(c==='cfg')return cfgObj()}
async function flush(path){if(!DB||RO)return;const d=docFor(path);if(!d){delete S.dirty[path];return}
 try{await DB.doc(path).set(JSON.parse(JSON.stringify(d)));delete S.dirty[path];setSync('ok')}catch(e){setSync('err')}persist()}
const flushAll=()=>Object.keys(S.dirty).forEach(flush);
function migrate(){S.orders.forEach(o=>{if(!o.d){o.d=ymd(o.ts);o.u=o.ts;S.dirty['orders/'+o.id]=1}})}
const dayChg=k=>{S.dayU[k]=Date.now();mark('day/'+k)};
function delAll(){if(DB)S.orders.forEach(o=>DB.doc('orders/'+o.id).delete().catch(()=>{}));S.dirty={}}
function nextSeq(dk){const p='NN'+dk.slice(2,4)+dk.slice(5,7)+dk.slice(8)+'-';let m=0;S.orders.forEach(o=>{if(o.no&&o.no.startsWith(p))m=Math.max(m,parseInt(o.no.slice(p.length))||0)});return m+1}
function softRender(){clearTimeout(sr);sr=setTimeout(()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ui.dirty=1;return}ui.dirty=0;render()},200)}
document.addEventListener('focusout',()=>{if(ui.dirty)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){ui.dirty=0;render()}},350)});
function mergeList(snap,key,cut){applying=true;const map=new Map(S[key].map(x=>[x.id,x])),seen=new Set();
 snap.docs.forEach(ds=>{const d=ds.data();if(!d)return;seen.add(ds.id);const l=map.get(ds.id);if(!l||(d.u||0)>(l.u||0))map.set(ds.id,JSON.parse(JSON.stringify(d)))});
 if(!snap.metadata.fromCache)map.forEach((v,id)=>{if(!seen.has(id)&&!S.dirty[key+'/'+id]&&(v.d||'')>=cut)map.delete(id)});
 S[key]=[...map.values()];persist();applying=false;softRender()}
function mergeStock(snap){snap.docs.forEach(ds=>{const d=ds.data();if(!d)return;const l=S.stock[ds.id];if(!l||(d.u||0)>(l.u||0))S.stock[ds.id]=JSON.parse(JSON.stringify(d))});persist();softRender()}
function mergeDay(snap){snap.docs.forEach(ds=>{const d=ds.data();if(!d||(d.u||0)<=(S.dayU[ds.id]||0))return;S.cashOpen[ds.id]=d.open||0;if(d.count==null)delete S.cashCount[ds.id];else S.cashCount[ds.id]=d.count;S.dayU[ds.id]=d.u});persist();softRender()}
function mergeCfg(s){if(!s.exists)return;const d=s.data();if((d.u||0)<=(S.cfgU||0))return;applying=true;S.menu=d.menu||S.menu;S.set=Object.assign(S.set,d.set||{});S.sitems=d.sitems||S.sitems;S.resep=d.resep||S.resep;ensureStock();S.cfgU=d.u;cfgSig=sigNow();persist();applying=false;softRender()}
async function initSync(){
